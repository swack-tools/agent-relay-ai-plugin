[package]
name = "relay-map-web"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
relay-map-core = { path = "../relay-map-core" }
serde.workspace = true
serde_json.workspace = true
wasm-bindgen = "=0.2.100"
js-sys = "0.3"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = ["Window", "console", "Storage", "Document", "Element", "HtmlElement", "HtmlCanvasElement", "CanvasRenderingContext2d", "CanvasGradient", "WebSocket", "MessageEvent", "MouseEvent", "WheelEvent", "KeyboardEvent", "Event", "EventTarget", "HtmlInputElement", "HtmlTextAreaElement", "HtmlSelectElement", "DomRect", "Location", "TextMetrics", "CssStyleDeclaration", "DomTokenList", "Performance", "CloseEvent", "NodeList", "Node", "Navigator", "Clipboard", "HtmlDocument", "Notification", "NotificationOptions", "NotificationPermission", "History", "Response"] }
