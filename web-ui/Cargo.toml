[workspace]
resolver = "2"
members = ["crates/relay-map-core", "crates/relay-map", "crates/relay-map-web"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[profile.release.package.relay-map-web]
opt-level = "s"
