name: Checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Package contract
        run: python3 -B scripts/check_plugin.py
      - name: Unit tests (Python 3.9, the oldest supported)
        run: python3 -B -m unittest discover -s tests -v
      - name: Verify deterministic release packaging
        run: |
          python3 -B scripts/package_release.py "$RUNNER_TEMP/pkg1"
          python3 -B scripts/package_release.py "$RUNNER_TEMP/pkg2"
          diff -u "$RUNNER_TEMP/pkg1/SHA256SUMS" "$RUNNER_TEMP/pkg2/SHA256SUMS"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Claude Code validator
        run: |
          npx --yes @anthropic-ai/claude-code plugin validate --strict plugins/agent-relay
          npx --yes @anthropic-ai/claude-code plugin validate --strict .claude-plugin/marketplace.json
      - name: Live Codex queue test
        run: |
          npm install -g @openai/codex
          codex app-server daemon start
          AGENT_RELAY_LIVE_CODEX=1 python3 -B -m unittest tests.test_live_codex -v

  web-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: web-ui
      - name: Rust tests (relay-map, relay-map-core, relay-map-web)
        run: cargo test --manifest-path web-ui/Cargo.toml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Verify MCP App UI bundle
        run: |
          cd ui
          npm ci
          node build.mjs
          git diff --exit-code ../plugins/agent-relay/assets/relay-map.html
